<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ukur Tanah GPS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      height: calc(100vh - 120px);
      width: 100%;
    }
    #panel {
      height: 120px;
      background: #ffffff;
      padding: 10px;
      text-align: center;
      border-top: 2px solid #ccc;
    }
    .status {
      font-size: 13px;
      font-weight: bold;
      color: #333;
      margin-bottom: 8px;
    }
    .info {
      font-size: 15px;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 15px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
    }
    #btn-tambah { background: #28a745; }
    #btn-reset { background: #dc3545; }
    button:disabled { background: #aaaaaa; }
  </style>
</head>
<body>

  <!-- Area Peta -->
  <div id="map"></div>

  <!-- Area Tombol & Info di Bawah Peta -->
  <div id="panel">
    <div id="text-status" class="status">Menunggu Sinyal GPS...</div>
    <div class="info">
      Titik: <span id="jml-titik">0</span> | Luas: <span id="luas-tanah">0</span> m²
    </div>
    <button id="btn-tambah" onclick="tambahTitik()" disabled>+ Tandai Titik Ini</button>
    <button id="btn-reset" onclick="resetAplikasi()">Reset</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  <script>
    var map;
    var userMarker;
    var polygonArea;
    var daftarTitik = [];
    var posisiSekarang = null;

    // 1. Inisialisasi Peta
    map = L.map('map').setView([-6.200000, 106.816666], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    // 2. Ambil GPS HP
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        function(position) {
          var lat = position.coords.latitude;
          var lng = position.coords.longitude;
          posisiSekarang = [lat, lng];

          // Aktifkan tombol "+ Tandai Titik Ini"
          document.getElementById('btn-tambah').disabled = false;
          document.getElementById('text-status').innerText = "GPS Terhubung! Silakan Berdiri di Patok Tanah.";
          document.getElementById('text-status').style.color = "green";

          // Buat / Update Penanda Lokasi Pengguna
          if (!userMarker) {
            userMarker = L.marker(posisiSekarang).addTo(map);
            map.setView(posisiSekarang, 18);
          } else {
            userMarker.setLatLng(posisiSekarang);
          }
        },
        function(error) {
          document.getElementById('text-status').innerText = "Gagal Akses GPS! Izinkan Akses Lokasi di Browser HP.";
          document.getElementById('text-status').style.color = "red";
        },
        { enableHighAccuracy: true, timeout: 15000 }
      );
    } else {
      document.getElementById('text-status').innerText = "Browser HP Tidak Mendukung GPS.";
    }

    // 3. Fungsi Tambah Titik
    function tambahTitik() {
      if (!posisiSekarang) return;
      daftarTitik.push(posisiSekarang);

      // Gambar titik lingkaran merah
      L.circleMarker(posisiSekarang, { color: 'red', radius: 5 }).addTo(map);

      // Update Angka Titik
      document.getElementById('jml-titik').innerText = daftarTitik.length;

      // Gambar Area
      if (polygonArea) map.removeLayer(polygonArea);

      if (daftarTitik.length >= 2) {
        polygonArea = L.polygon(daftarTitik, { color: 'blue' }).addTo(map);
      }

      // Hitung Luas jika titik >= 3
      if (daftarTitik.length >= 3) {
        var turfPoints = daftarTitik.map(function(pt) { return [pt[1], pt[0]]; });
        turfPoints.push(turfPoints[0]);

        var poly = turf.polygon([turfPoints]);
        var area = turf.area(poly);

        document.getElementById('luas-tanah').innerText = area.toFixed(2);
      }
    }

    // 4. Reset
    function resetAplikasi() {
      location.reload();
    }
  </script>
</body>
</html>
