<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Ukur Tanah GPS</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; }
    #map { width: 100%; height: 100vh; z-index: 1; }

    /* Panel mengambang di atas peta */
    .floating-panel {
      position: absolute;
      bottom: 20px;
      left: 5%;
      right: 5%;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      text-align: center;
    }

    .status-box {
      font-size: 12px;
      padding: 6px;
      margin-bottom: 10px;
      border-radius: 6px;
      background: #fff3cd;
      color: #856404;
      font-weight: bold;
    }

    .info-box {
      font-size: 14px;
      margin-bottom: 12px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px 5px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      color: white;
      cursor: pointer;
    }

    .btn-add { background: #28a745; }
    .btn-reset { background: #dc3545; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Panel kontrol mengambang -->
  <div class="floating-panel">
    <div id="status" class="status-box">Mencari Sinyal GPS...</div>
    <div class="info-box">
      Titik: <b id="point-count">0</b> | Luas: <b id="area-result">0</b> m²
    </div>
    <div class="btn-group">
      <button id="btn-add" class="btn btn-add" onclick="tambahTitik()" disabled>+ Tandai Titik</button>
      <button class="btn btn-reset" onclick="resetPeta()">Reset</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  <script>
    let map, markerUser, polygon;
    let titikKoordinat = [];
    let currentPos = null;

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([-6.200000, 106.816666], 15);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      }).addTo(map);

      lacakLokasi();
    }

    function setStatus(pesan, sukses = false) {
      const el = document.getElementById('status');
      el.innerText = pesan;
      if (sukses) {
        el.style.background = '#d4edda';
        el.style.color = '#155724';
      } else {
        el.style.background = '#fff3cd';
        el.style.color = '#856404';
      }
    }

    function lacakLokasi() {
      if (!navigator.geolocation) {
        setStatus("Browser HP tidak mendukung GPS");
        return;
      }

      navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const acc = Math.round(pos.coords.accuracy);
          currentPos = [lat, lng];

          // Aktifkan tombol "+ Tandai Titik" saat lokasi terkunci
          document.getElementById('btn-add').disabled = false;
          setStatus(`GPS Aktif (Akurasi: ±${acc}m)`, true);

          if (!markerUser) {
            markerUser = L.marker(currentPos).addTo(map);
            map.setView(currentPos, 18);
          } else {
            markerUser.setLatLng(currentPos);
          }
        },
        (err) => {
          if(err.code === 1) {
            setStatus("Izin GPS Ditolak! Cek Pengaturan Browser HP.");
          } else {
            setStatus("Mencari Sinyal GPS... Pastikan di luar ruangan.");
          }
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    function tambahTitik() {
      if (!currentPos) return;
      titikKoordinat.push(currentPos);
      
      // Beri tanda berupa lingkaran di peta
      L.circleMarker(currentPos, { radius: 6, color: 'red', fillColor: '#f03', fillOpacity: 0.8 }).addTo(map);
      
      updatePengukuran();
    }

    function updatePengukuran() {
      document.getElementById('point-count').innerText = titikKoordinat.length;

      if (polygon) map.removeLayer(polygon);

      if (titikKoordinat.length >= 2) {
        polygon = L.polygon(titikKoordinat, { color: 'blue', fillColor: '#3085d6', fillOpacity: 0.4 }).addTo(map);
      }

      if (titikKoordinat.length >= 3) {
        const turfPoints = titikKoordinat.map(pt => [pt[1], pt[0]]);
        turfPoints.push(turfPoints[0]);

        const polyGeoJSON = turf.polygon([turfPoints]);
        const areaInMeters = turf.area(polyGeoJSON);

        document.getElementById('area-result').innerText = areaInMeters.toFixed(2);
      }
    }

    function resetPeta() {
      location.reload();
    }

    window.onload = initMap;
  </script>
</body>
</html>
